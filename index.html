<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art Gallery Portfolio</title>
    
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://*.supabase.co https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co;">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="nav-header">
        <div class="nav-links">
            <button onclick="showPage('home')">home</button>
            <button onclick="showPage('gallery')">gallery</button>
        </div>
        <div class="auth-buttons">
            <button id="login-btn" onclick="showPage('login-page')">log in</button>
            <button id="signup-btn" onclick="showPage('signup-page')">sign up</button>
            <button id="logout-btn" class="hidden">log out</button>
        </div>
    </div>

    <main id="main-container">
        
        <section id="home" class="page">
            <h1>Welcome to the Gallery</h1>
        </section>

        <section id="gallery" class="page hidden">
            <h2>Art Gallery</h2>
            <div class="thumbnail-grid">
                <div class="art-thumb" onclick="viewArtwork('Star Tail', 'A sketch of Shiny in a new outfit.', 'your-image-url.png')">
                    <p>Click to view artwork</p>
                </div>
            </div>
        </section>

        <section id="artwork-view" class="page hidden">
            <button onclick="showPage('gallery')">&lt;&lt; back to gallery</button>
            <div class="viewer-content">
                <img id="art-image" src="" alt="Full Art">
                <h3 id="art-title">Title</h3>
                <p id="art-desc">Description</p>
            </div>
        </section>

        <section id="signup-page" class="page hidden">
            <button onclick="showPage('home')">&lt;&lt; back</button>
            <form id="signup-form">
                <h2>Sign Up</h2>
                <input type="email" id="signup-email" placeholder="e-mail address" required>
                <input type="password" id="signup-password" placeholder="password" required>
                <button type="submit">create account</button>
            </form>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>
</body>
</html>
